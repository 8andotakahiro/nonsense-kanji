<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Morphing — Nonsense Kanji</title>
<link rel="stylesheet" href="../style.css?v=6">
<style>
.cp-hero { padding: 60px 40px 56px; border-bottom: 1px solid var(--border); text-align: center; }
.cp-title { font-size: clamp(36px, 6vw, 72px); font-weight: 200; letter-spacing: .1em; line-height: 1.1; margin-bottom: 16px; }
.cp-subtitle { font-size: 13px; letter-spacing: .2em; color: var(--muted); }
.cp-video { padding: 64px 40px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
.cp-video .section-label { margin-bottom: 32px; }
.cp-video .video-wrap { max-width: 860px; width: 100%; }
.cp-desc { padding: 64px 40px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
.cp-desc .section-label { margin-bottom: 32px; }
.cp-desc-body { max-width: 640px; font-size: 13px; line-height: 2.4; color: #444; text-align: center; }
.cp-desc-body p + p { margin-top: 1.4em; }
.cp-tech { padding: 64px 40px; border-bottom: 1px solid var(--border); background: var(--white); display: flex; flex-direction: column; align-items: center; }
.cp-tech .section-label { margin-bottom: 40px; }
.cp-tech-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; max-width: 960px; width: 100%; border: 1px solid var(--border); }
@media (max-width: 860px) { .cp-tech-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .cp-tech-grid { grid-template-columns: 1fr; } }
.tech-card { padding: 24px 20px; background: #fff; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.tech-card:nth-child(3n) { border-right: none; }
@media (max-width: 860px) { .tech-card:nth-child(3n) { border-right: 1px solid var(--border); } .tech-card:nth-child(2n) { border-right: none; } }
.tech-diagram { width: 100%; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.tech-diagram svg { width: 100%; height: auto; display: block; }
.tech-card-title { font-size: 10px; letter-spacing: .15em; margin-bottom: 10px; color: #111; }
.tech-card-desc { font-size: 11px; line-height: 1.9; color: #999; }
.cp-gallery { padding: 64px 40px 80px; display: flex; flex-direction: column; align-items: center; }
.cp-gallery .section-label { margin-bottom: 32px; }
.cp-gallery .gallery-grid { width: 100%; max-width: 960px; }
</style>
</head>
<body class="has-nav">
<nav>
  <span class="nav-logo">Ando Takahiro</span>
  <a class="nav-back" href="index.html">← Nonsense Kanji に戻る</a>
</nav>

<section class="cp-hero">
  <h1 class="cp-title">Kanji Morphing</h1>
</section>

<section class="cp-video">
  <div class="video-wrap">
    <video autoplay muted loop playsinline controls>
      <source src="../assets/videos/nonsense-kanji/md_kanjimorph01.mp4" type="video/mp4">
    </video>
  </div>
  <div class="video-wrap" style="margin-top: 40px;">
    <video autoplay muted loop playsinline controls>
      <source src="../assets/videos/nonsense-kanji/nk_morph001.mp4" type="video/mp4">
    </video>
  </div>
</section>


<section class="cp-video" style="border-bottom: 1px solid var(--border);">
  <div class="video-wrap">
    <img src="../assets/images/nonsense-kanji/generated_symbols_a4.png"
         alt="拡散モデルが生成した漢字らしい記号のグリッド"
         style="width:100%; display:block;">
  </div>
</section>



<section class="cp-gallery">
  <div class="gallery-grid" id="gallery">
    <!-- images go here -->
  </div>
</section>

<footer>
  <span>Ando Takahiro</span>
</footer>
</body>
</html>
